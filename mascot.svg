<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- หนูดำ (Nu Dam), the faculty's best-known cat, as the brand mascot: black coat, white socks,
       pink collar with a green tag (as in her photos). Colours come from CSS variables so she works on light and dark pages:
       --cat (coat), --cat-line (outline, used on dark pages), --cat-eye, --pink, --tag. -->
  <symbol id="nd-head" viewBox="0 0 64 64">
    <path d="M14 30 11 8.5 27 19.5Z M50 30 53 8.5 37 19.5Z" style="fill:var(--cat,#16181d);stroke:var(--cat,#16181d);stroke-width:4;stroke-linejoin:round"/>
    <ellipse cx="32" cy="35" rx="23" ry="20.5" style="fill:var(--cat,#16181d);stroke:var(--cat-line,transparent);stroke-width:2.4"/>
    <path d="M14 30 11 8.5 27 19.5 M50 30 53 8.5 37 19.5" style="fill:none;stroke:var(--cat-line,transparent);stroke-width:2.4;stroke-linejoin:round"/>
    <ellipse cx="23.5" cy="34" rx="3.6" ry="4.2" style="fill:var(--cat-eye,#fff)"/>
    <ellipse cx="40.5" cy="34" rx="3.6" ry="4.2" style="fill:var(--cat-eye,#fff)"/>
    <path d="M29.6 41.5h4.8L32 44.3Z" style="fill:var(--pink,#e2447a)"/>
    <path d="M17 52.5Q32 60.5 47 52.5" style="fill:none;stroke:var(--pink,#e2447a);stroke-width:4;stroke-linecap:round"/>
    <circle cx="32" cy="58.6" r="3.3" style="fill:var(--tag,#3fbf7f)"/>
  </symbol>

  <symbol id="nd-sit" viewBox="0 0 120 130">
    <path d="M86 116C110 116 116 96 104 82" style="fill:none;stroke:var(--cat,#16181d);stroke-width:10;stroke-linecap:round"/>
    <path d="M36 116C33 92 41 70 60 68C79 70 87 92 84 116C84 121 80 124 75 124H45C40 124 36 121 36 116Z" style="fill:var(--cat,#16181d);stroke:var(--cat-line,transparent);stroke-width:2.4"/>
    <ellipse cx="51" cy="122" rx="6.5" ry="4" style="fill:var(--sock,#fff)"/>
    <ellipse cx="69" cy="122" rx="6.5" ry="4" style="fill:var(--sock,#fff)"/>
    <use href="#nd-head" x="28" y="14" width="64" height="64"/>
  </symbol>

  <symbol id="nd-sleep" viewBox="0 0 140 90">
    <path d="M30 80C10 80 8 62 22 58" style="fill:none;stroke:var(--cat,#16181d);stroke-width:9;stroke-linecap:round"/>
    <ellipse cx="78" cy="62" rx="48" ry="24" style="fill:var(--cat,#16181d);stroke:var(--cat-line,transparent);stroke-width:2.4"/>
    <path d="M30 56 26 36 42 46Z M56 50 62 31 70 47Z" style="fill:var(--cat,#16181d);stroke:var(--cat,#16181d);stroke-width:4;stroke-linejoin:round"/>
    <ellipse cx="46" cy="62" rx="22" ry="18" style="fill:var(--cat,#16181d);stroke:var(--cat-line,transparent);stroke-width:2.4"/>
    <path d="M35 61q4 3.5 8 0 M50 61q4 3.5 8 0" style="fill:none;stroke:var(--cat-eye,#fff);stroke-width:2.4;stroke-linecap:round"/>
    <path d="M44.6 67h3.4l-1.7 2Z" style="fill:var(--pink,#e2447a)"/>
    <ellipse cx="60" cy="83" rx="9" ry="4" style="fill:var(--sock,#fff)"/>
    <text x="96" y="30" style="fill:var(--pink,#e2447a);font:700 15px sans-serif">z</text>
    <text x="108" y="18" style="fill:var(--pink,#e2447a);font:700 11px sans-serif;opacity:.7">z</text>
  </symbol>

  <symbol id="nd-peek" viewBox="0 0 120 80">
    <use href="#nd-head" x="28" y="6" width="64" height="64"/>
    <ellipse cx="44" cy="70" rx="9" ry="5.5" style="fill:var(--sock,#fff);stroke:var(--cat,#16181d);stroke-width:2.4"/>
    <ellipse cx="76" cy="70" rx="9" ry="5.5" style="fill:var(--sock,#fff);stroke:var(--cat,#16181d);stroke-width:2.4"/>
    <path d="M4 74H116" style="stroke:var(--cat,#16181d);stroke-width:3;stroke-linecap:round"/>
  </symbol>
</svg>
